
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - TrustVault</title>
</head>
<body>

<h1>TrustVault — Admin Document Sharing</h1>

<p>
    <a href="/documents">My Documents</a> |
    <a href="/documents/upload">Upload Document</a>
</p>

<p th:if="${message}" th:text="${message}"></p>

<table border="1" cellpadding="10">
    <thead>
    <tr>
        <th>ID</th>
        <th>Document</th>
        <th>Uploader</th>
        <th>Share with owner</th>
        <th>Revoke access</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="doc : ${documents}">
        <td th:text="${doc.id}"></td>
        <td th:text="${doc.name}"></td>
        <td th:text="${doc.ownerUsername}"></td>

        <td>
            <form th:action="@{/admin/documents/{id}/share(id=${doc.id})}"
                  method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <input type="text"
                       name="sharedWithUsername"
                       placeholder="owner"
                       required>
                <button type="submit">Grant Read Access</button>
            </form>
        </td>

        <td>
            <form th:action="@{/admin/documents/{id}/revoke(id=${doc.id})}"
                  method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <input type="text"
                       name="sharedWithUsername"
                       placeholder="owner"
                       required>
                <button type="submit">Revoke</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
