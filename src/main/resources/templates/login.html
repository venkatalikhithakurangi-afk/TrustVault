
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            width: 350px;
            max-width: calc(100% - 56px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #172554;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #1d4ed8;
        }
    </style>
</head>

<body>
<div class="login-box">

    <h1>TrustVault</h1>
    <p class="subtitle">Sign in to your account</p>

    <p class="message error"
       th:if="${param.error}">
        Invalid username or password.
    </p>

    <p class="message success"
       th:if="${param.registered}">
        Registration successful! Please log in.
    </p>

    <p class="message success"
       th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input id="username"
               type="text"
               name="username"
               required
               autocomplete="username">

        <label for="password">Password</label>
        <input id="password"
               type="password"
               name="password"
               required
               autocomplete="current-password">

        <button type="submit">Login</button>
    </form>

    <p class="register-link">
        New to TrustVault?
        <a th:href="@{/register}">Create an account</a>
    </p>

</div>
</body>
</html>
